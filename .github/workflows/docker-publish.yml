name: Docker image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/wooooooooooook/dv-auto

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read commit metadata
        id: build-meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      # 서버가 arm64 이므로 두 아키텍처를 하나의 manifest list 로 게시한다.
      # arm64 는 QEMU 에뮬레이션으로 빌드되어 amd64 보다 오래 걸린다.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 브라우저/apt 설치 레이어는 소스 변경만으로는 재실행되지 않는다.
      # lockfile 변경이나 캐시 만료 시에만 다시 받으며, gha 캐시로 빌드 간 재사용한다.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.build-meta.outputs.sha }}
            GIT_COMMIT_DATE=${{ steps.build-meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
