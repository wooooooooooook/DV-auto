name: Monitor Seminar (Evening)

on:
  schedule:
    - cron: '1 6 * * *' # 15:01 KST
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ vars.ENABLE_MONITOR == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      DV_USER: ${{ secrets.DV_USER }}
      DV_PASS: ${{ secrets.DV_PASS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTICE_BOT_TOKEN: ${{ secrets.NOTICE_BOT_TOKEN }}
      NOTICE_CHANNEL_ID: ${{ secrets.NOTICE_CHANNEL_ID }}
      HEADLESS: 'true'
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Use repo pnpm version
        run: corepack prepare pnpm@10.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Browsers
        id: cache-playwright-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-node20
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Build
        run: pnpm run build

      - name: Run evening seminar monitor
        run: node dist/services/run_monitor.js dinner
