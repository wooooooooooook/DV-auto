name: Run Macro

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-macro:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run macro.js
        run: node macro.js
        env:
          DV_USER: ${{ secrets.DV_USER }}
          DV_PASS: ${{ secrets.DV_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTICE_BOT_TOKEN: ${{ secrets.NOTICE_BOT_TOKEN }}
          NOTICE_CHANNEL_ID: ${{ secrets.NOTICE_CHANNEL_ID }}
          HEADLESS: ${{ secrets.HEADLESS || 'true' }}
          DAILY_CRON: ${{ secrets.DAILY_CRON || '0 0 13 * * *' }}
          SCHEDULE_TZ: ${{ secrets.SCHEDULE_TZ || 'Asia/Seoul' }}
