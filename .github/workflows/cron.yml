name: Run Macro

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-macro:
    if: ${{ secrets.RUN_WORKFLOW == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Browsers
        id: cache-playwright-browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          # matrix.node-version이 없으니 runner.os + hashFiles + node-version 문자열로 대체
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}-node20
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Build
        run: pnpm run build

      - name: Run macro.js
        run: node dist/services/macro.js
        env:
          DV_USER: ${{ secrets.DV_USER }}
          DV_PASS: ${{ secrets.DV_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
