<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>닥터빌 세미나 설문조사 - 1페이지</title>
</head>
<body>
  <div id="survey-container">
    <ol>
      <li data-question-number="1">
        <div class="whitespace-pre-wrap"><span>[퀴즈]</span> 데노수맙 투여 대상 환자군은?</div>
        <ol>
          <li><label><input type="radio" name="q1" value="1" /><span>골절 고위험군 및 초고위험군</span></label></li>
          <li><label><input type="radio" name="q1" value="2" /><span>골감소증 환자</span></label></li>
          <li><label><input type="radio" name="q1" value="3" /><span>정상 T-score 환자</span></label></li>
        </ol>
      </li>
      <li data-question-number="2">
        <div class="whitespace-pre-wrap"><span>[퀴즈]</span> 바이오시밀러의 특징으로 옳은 것은?</div>
        <ol>
          <li><label><input type="radio" name="q2" value="1" /><span>오리지널과 무관하다</span></label></li>
          <li><label><input type="radio" name="q2" value="2" /><span>임상 1상이 필요하다</span></label></li>
          <li><label><input type="radio" name="q2" value="3" /><span>1상 임상을 통한 약동학·약력학 동등성 입증은 불필요하다</span></label></li>
        </ol>
      </li>
      <li data-question-number="3">
        <div class="whitespace-pre-wrap"><span>[퀴즈]</span> 스토보클로 디바이스 특징으로 옳은 것은?</div>
        <ol>
          <li><label><input type="radio" name="q3" value="1" /><span>얇은 바늘</span></label></li>
          <li><label><input type="radio" name="q3" value="2" /><span>일회용 주사기</span></label></li>
          <li><label><input type="radio" name="q3" value="3" /><span>넓은 손가락 받침으로 주사 시 투여 편의성을 개선하였다</span></label></li>
        </ol>
      </li>
    </ol>
    <div class="button-area">
      <button type="button" class="btn-next">다음</button>
    </div>
  </div>
</body>
</html>
