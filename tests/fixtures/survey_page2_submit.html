<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>닥터빌 세미나 설문조사 - 2페이지</title>
</head>
<body>
  <div id="survey-container">
    <ol>
      <li data-question-number="4">
        <div class="whitespace-pre-wrap">강의 내용에 전반적으로 만족하십니까?</div>
        <ol>
          <li><label><input type="radio" name="q4" value="1" /><span>매우 만족</span></label></li>
          <li><label><input type="radio" name="q4" value="2" /><span>보통</span></label></li>
          <li><label><input type="radio" name="q4" value="3" /><span>불만족</span></label></li>
        </ol>
      </li>
      <li data-question-number="5">
        <div class="whitespace-pre-wrap">향후 희망하는 강의 주제가 있으십니까?</div>
        <ol>
          <li><label><input type="radio" name="q5" value="1" /><span>해당 없음</span></label></li>
          <li><label><input type="radio" name="q5" value="2" /><span>있음</span></label></li>
        </ol>
      </li>
    </ol>
    <div class="button-area">
      <button type="button" class="btn-primary">제출하기</button>
    </div>
  </div>
</body>
</html>
