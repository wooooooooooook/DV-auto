services:
  dv-auto:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dv-auto

    restart: unless-stopped
    init: true

    environment:
      # 텔레그램 /log·/update_app 명령의 도커 분기 감지 플래그
      DV_DOCKER: 1

      DV_USER: ${DV_USER}
      DV_PASS: ${DV_PASS}
      INTERMD_USER_ID: ${INTERMD_USER_ID}
      INTERMD_USER_PW: ${INTERMD_USER_PW}

      KEYMEDI_USER: ${KEYMEDI_USER}
      KEYMEDI_PASS: ${KEYMEDI_PASS}
      HMP_USER: ${HMP_USER}
      HMP_PASS: ${HMP_PASS}
      DOCPLE_USER: ${DOCPLE_USER}
      DOCPLE_PASS: ${DOCPLE_PASS}
      MEDIGATE_USER: ${MEDIGATE_USER}
      MEDIGATE_PASS: ${MEDIGATE_PASS}

      USER_NAME: ${USER_NAME}
      USER_PHONE_1: ${USER_PHONE_1}
      USER_PHONE_2: ${USER_PHONE_2}
      USER_PHONE_3: ${USER_PHONE_3}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

      NOTICE_BOT_TOKEN: ${NOTICE_BOT_TOKEN}
      NOTICE_CHANNEL_ID: ${NOTICE_CHANNEL_ID}

      HEADLESS: ${HEADLESS}
      
      HERMES_API_KEY: ${HERMES_API_KEY}

      # 퀴즈 등록 git 동기화 (도커): 동기화 저장소를 볼륨에 유지하고 PAT 로 push
      DV_GIT_REPO_DIR: /app/runtime-data/repo
      GITHUB_TOKEN: ${GITHUB_TOKEN}

      # Portainer 스택 업데이트 (/update_app). PORTAINER_URL 미설정 시 기존 안내 메시지로 동작
      PORTAINER_URL: ${PORTAINER_URL}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY}
      PORTAINER_USERNAME: ${PORTAINER_USERNAME}
      PORTAINER_PASSWORD: ${PORTAINER_PASSWORD}
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID}
      PORTAINER_STACK_ID: ${PORTAINER_STACK_ID}
      PORTAINER_STACK_NAME: ${PORTAINER_STACK_NAME}
    volumes:
      - /opt/dv-auto/data:/app/runtime-data

    stop_grace_period: 30s
